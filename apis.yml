name: Piazza
description: 'Piazza is an online question-and-answer platform for higher education that connects
  students, teaching assistants, and professors in a single wiki-style collaborative space for each
  class. Instructors run a Piazza for their course where students ask and answer questions, post
  anonymously, use a LaTeX and code editor for technical content, and receive instructor-endorsed
  answers. Piazza integrates with every major learning management system (Canvas, Blackboard, Moodle,
  Sakai, Desire2Learn, and others) via the LTI standard for single-click class creation, roster-based
  automatic enrollment, and automatic single sign-on. It is used across thousands of universities in
  more than 90 countries and is FERPA-compliant. Piazza does not publish an official public developer
  API; LMS connectivity is delivered through LTI, and only community projects wrap its internal
  endpoints.'
